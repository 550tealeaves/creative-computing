<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Monthly Data</h1>

    <canvas id="myChart"></canvas>

    <script>
        const myChart = new Chart(
    document.getElementById('myChart'),

    {
        type: 'bar',

        data: {
            labels: ['January',
                'February',
                'March',
                'April',
                'May',
                'June',
                'July',
                'August',
                'September'],

            datasets: [{
                label: 'Monthly Data',
                data: [65,
                    59,
                    80,
                    81,
                    56,
                    55,
                    40,
                    71,
                    25],
                backgroundColor: ['rgba(255, 99, 132, 0.3)',
                    'rgba(255, 159, 64, 0.3)',
                    'rgba(255, 205, 86, 0.3)',
                    'rgba(75, 192, 192, 0.3)',
                    'rgba(54, 162, 235, 0.3)',
                    'rgba(153, 102, 255, 0.3)',
                    'rgba(201, 203, 207, 0.3)',
                    'rgba(250, 200, 180, 0.3)',
                    'rgba(39,52,127, 0.3)']
            }]
        },

        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    }
);
    </script>
</body>
</html>
