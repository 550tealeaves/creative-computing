<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scatter Chart</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <h1 style="text-align: center; color: mediumslateblue; font-size: 22px;">Scatter Chart</h1>

    <canvas id="myChart"></canvas>


    <script>

        // -------------------------
        // DATA
        // -------------------------

        //const labels = Utils.months({ count: 7 });
            const data = {
                datasets: [{
                    label: 'Scatter dataset',
                    data: [{
                        x: -10,
                        y: 0
                    }, {
                        x: 0,
                        y: 10
                    }, {
                        x: 10,
                        y: 5,
                    }, {
                        x: 0.5,
                        y: 5.5
                    }
                ],
                    backgroundColor: [
                        'rgb(255, 99, 132)',
                        'rgb(255, 159, 64)',
                        'rgb(255, 205, 86)',
                        'rgb(75, 192, 192)'
                    ],
                }]
            };


        // -------------------------
        // CHART CONFIGURATION
        // -------------------------

        const config = {
                type: 'scatter',
                data: data,
                options: {
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom'
                        }
                    },
                    pointRadius: 4,
                    hoverBorderWidth: 12
                }
            };

        // -------------------------
        // CREATE CHART
        // -------------------------

        const myChart = new Chart(

            document.getElementById('myChart'),

            config

        );

    </script>

</body>

</html>
