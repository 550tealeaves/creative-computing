<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Polar Area Chart</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <h1 style="text-align: center; font-size: 22px; color: brown;">Polar Area Chart</h1>

    <canvas id="myChart"></canvas>


    <script>

        // -------------------------
        // DATA
        // -------------------------

        const data = {

            labels: [
                'Orange',
                'Green',
                'Yellow',
                'Purple',
                'Blue'
            ],
            datasets: [{

                label: 'Polar Area Dataset',

                data: [11, 16, 7, 3, 14],

                backgroundColor: [
                    'rgb(255, 99, 12)',
                    'rgb(75, 212, 192)',
                    'rgb(255, 205, 86)',
                    'rgb(201, 23, 247)',
                    'rgb(54, 162, 235)'
                ],
            }]

        };


        // -------------------------
        // CHART CONFIGURATION
        // -------------------------

        const config = {

            type: 'polarArea',

            data: data,

            //OPTIONS ADDS GLOBAL CHANGES TO CHART
            options: {}
            //options: {hoverBorderWidth: 7} - radius added when hovering over markers

        };


        // -------------------------
        // CREATE CHART
        // -------------------------

        const myChart = new Chart(

            document.getElementById('myChart'),

            config

        );

    </script>

</body>

</html>
