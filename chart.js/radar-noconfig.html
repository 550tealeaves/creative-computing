<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1 style="text-align: center; font-size: 22px; color: coral;">Radar Chart with Options</h1>

    <canvas id="myChart"></canvas>

    <script>
        const myChart = new Chart(
    document.getElementById('myChart'),

    {
        type: 'radar',

        data: {
            labels: [
                'Eating',
                'Drinking',
                'Sleeping',
                'Designing',
                'Coding',
                'Cycling',
                'Running'

            ],
            datasets: [{

                label: 'First Dataset',

                data: [65, 59, 90, 81, 56, 55, 40],
                fill: true,
                backgroundColor: 'rgba(20, 59, 132, 0.2)',
                borderColor: 'rgb(35, 99, 182)',
                pointBackgroundColor: 'rgb(35, 99, 182)',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: 'rgb(255, 99, 132)'
            }, {
                label: 'Second Dataset',
                data: [28, 48, 40, 19, 96, 27, 100],
                fill: true,
                backgroundColor: 'rgba(154, 22, 235, 0.2)',
                borderColor: 'rgb(154, 92, 235)',
                pointBackgroundColor: 'rgb(150, 62, 235)',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: 'rgb(154, 62, 235)'
            }
        ]
        },

        //OPTIONS MAKE GLOBAL CHANGES TO CHART
        options: {
            hoverRadius: 12, //radius added when hovering over marker
            hoverBorderWidth: 5, //border width when hovering
            tension: 2,
            pointRadius: 10,
            pointStyle: 'rect',
            pointRotation: 8
        
        }
    }
);
    </script>
</body>
</html>
