<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Monthly Data</h1>

    <canvas id="myChart"></canvas>

    <script>
        const myChart = new Chart(
    document.getElementById('myChart'),

    {
        type: 'bar',

        data: {
            labels: ['Apples', 'Blueberries', 'Clementines', 'Dates'],

            datasets: [{
                label: 'Fruit Inventory',
                data: [100, 250, 175, 300],
                backgroundColor: ['crimson', 'forestgreen', 'gold', 'violet']
            }]
        },

        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    }
);
    </script>
</body>
</html>
