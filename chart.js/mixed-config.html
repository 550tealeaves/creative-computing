<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chart.js Mixed Chart</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <h1>Monthly Data</h1>

    <canvas id="myChart"></canvas>


    <script>

        // -------------------------
        // DATA
        // -------------------------

        const data = {

            labels: [
                'January',
                'February',
                'March',
                'April'
            ],
            //Must specify chart type on each dataset
            datasets: [{
                //Bar chart
                type: 'bar',
                label: 'Bar Dataset',
                data: [10, 20, 30, 40],
                borderColor: 'rgb(195, 99, 155)',
                backgroundColor: 'rgba(255, 9, 132, 0.3)'
            }, 
            {   //Line chart
                type: 'line',
                label: 'Line Dataset',
                data: [17, 44, 8, 29],
                fill: true, //this will fill the area below if true. If false, doesn't
                borderColor: 'rgb(50, 160, 235)'
            }
        ]

        };


        // -------------------------
        // CHART CONFIGURATION
        // -------------------------

        const config = {

            type: 'scatter',

            data: data,

            options: {

                scales: {

                    y: {

                        beginAtZero: true

                    }

                }

            }

        };


        // -------------------------
        // CREATE CHART
        // -------------------------

        const myChart = new Chart(

            document.getElementById('myChart'),

            config

        );

    </script>

</body>

</html>
