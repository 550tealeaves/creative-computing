<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1 style="text-align: center; color: mediumslateblue; font-size: 22px;">Mixed Chart</h1>

    <canvas id="myChart"></canvas>

    <script>
        const myChart = new Chart(
    document.getElementById('myChart'),

    {
        type: 'scatter',

        data: {
            labels: [
                'January',
                'February',
                'March',
                'April',
                'May',
                'June'
            ],

            datasets: [{
                type: 'bar',
                label: 'Bar dataset',
                data: [10, 20, 30, 40, 50, 60],
                borderColor: 'rgb(195, 99, 155)',
                backgroundColor: 'rgba(255, 9, 132, 0.3)'
            }, 
            {
                //Line chart
                type: 'line',
                label: 'Line dataset',
                data: [22, 6, 41, 33, 50, 17],
                fill: false,
                borderColor: 'rgb(50, 160, 235)'
            }
        ]
        },

        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            stepped: true,
            pointStyle: 'star',
            pointRadius: 10,
            pointBorderWidth: 3,
            hoverBorderWidth: 4
        }
    }
);
    </script>
</body>
</html>
