<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chart.js Mixed Chart</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <h1 style="text-align: center; font-size: 22px; color: indigo;">Monthly Data</h1>

    <canvas id="myChart"></canvas>


    <script>

        // -------------------------
        // DATA
        // -------------------------

        const data = {

            labels: [
                'January',
                'February',
                'March',
                'April',
                'May',
                'June',
                'August'
            ],
            //Must specify chart type on each dataset
            datasets: [{
                //Bar chart
                type: 'bar',
                label: 'Bar Dataset',
                data: [10, 20, 30, 40, 50, 60, 70],
                borderColor: 'rgb(195, 99, 155)',
                backgroundColor: 'rgba(255, 9, 132, 0.3)'
            }, 
            {   //Bubble chart
                type: 'bubble',
                label: 'Bubble Dataset',
                data: [{
                    x: 5,
                    y: 25,
                    r: 18
                }, {
                    x: 42,
                    y: 8,
                    r: 32
                }, {
                    x: 29,
                    y: 19,
                    r: 9,
                }, {
                    x: 4,
                    y: 22,
                    r: 45
                }, {
                    x: 3,
                    y: 27,
                    r: 29
                }, {
                    x: 5,
                    y: 64,
                    r: 41
                }, {
                    x: 19,
                    y: 52,
                    r: 23
                }
            ],
                borderColor: 'rgb(50, 160, 235)'
            }
        ]

        };


        // -------------------------
        // CHART CONFIGURATION
        // -------------------------

        const config = {

            type: 'scatter',

            data: data,

            options: {

                scales: {

                    y: {

                        beginAtZero: true

                    }

                }

            }

        };


        // -------------------------
        // CREATE CHART
        // -------------------------

        const myChart = new Chart(

            document.getElementById('myChart'),

            config

        );

    </script>

</body>

</html>
